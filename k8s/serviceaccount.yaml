apiVersion: v1
kind: ServiceAccount
metadata:
  name: autenticacao-service
  namespace: tech-challenge
  annotations:
    iam.gke.io/gcp-service-account: autenticacao-service@vcosta-fiap-tech-challenge.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autenticacao-service
  namespace: tech-challenge
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["autenticacao-service"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autenticacao-service
  namespace: tech-challenge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autenticacao-service
subjects:
  - kind: ServiceAccount
    name: autenticacao-service
    namespace: tech-challenge
